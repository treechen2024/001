<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>易經六十四卦</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            align-items: flex-start;
            padding: 20px;
        }

        canvas {
            width: 600px;
            height: 800px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        #hexagramName {
            margin-top: 20px;
            font-size: 32px;
            font-weight: bold;
        }

        #yaoTextContainer {
            margin-left: 40px;
            font-size: 20px;
            max-height: 600px;
            width: 300px;
            overflow-y: auto;
        }

        .yao-text {
            margin-bottom: 12px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

        #yaoTextContainer {
            margin-left: 0;
            margin-top: 20px;
            width: 90%;
            max-height: 400px;
        }

        canvas {
            width: 90%;
            height: auto;
        }

        #hexagramName {
            font-size: 24px;
        }

        #yaoTextContainer {
            font-size: 16px;
        }

        .yao-text {
            margin-bottom: 8px;
        }
    }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="hexagramCanvas" width="600" height="800"></canvas>
        <div id="yaoTextContainer">
            <div class="yao-text" id="yao5"></div>
            <div class="yao-text" id="yao4"></div>
            <div class="yao-text" id="yao3"></div>
            <div class="yao-text" id="yao2"></div>
            <div class="yao-text" id="yao1"></div>
            <div class="yao-text" id="yao0"></div>
        </div>
    </div>
    <div id="hexagramName"></div>

    <script>
        // 卦辭資料 (乾、坤、屯、蒙 示例)
        const yaoText = {
            '111111': {
                name: '乾',
                yaoCi: [
                    '初九，潛龍勿用。',
                    '九二，見龍在田，利見大人。',
                    '九三，君子終日乾乾，夕惕若厲，無咎。',
                    '九四，或躍在淵，無咎。',
                    '九五，飛龍在天，利見大人。',
                    '上九，亢龍有悔。'
                ]
            },
            '000000': {
                name: '坤',
                yaoCi: [
                    '初六，履霜，堅冰至。',
                    '六二，直方大，不習無不利。',
                    '六三，含章可貞，或從王事，無成有終。',
                    '六四，括囊，無咎無譽。',
                    '六五，黃裳，元吉。',
                    '上六，龍戰于野，其血玄黃。'
                ]
            },
            '010001': {
                name: '屯',
                yaoCi: [
                    '初九，磐桓；利居貞，利建侯。',
                    '六二，屯如邅如，乘馬班如。匪寇婚媾，女子貞不字，十年乃字。',
                    '六三，即鹿無虞，惟入于林中；君子幾不如舍，往吝。',
                    '六四，乘馬班如，求婚媾，往吉，無不利。',
                    '九五，屯其膏，小貞吉，大貞凶。',
                    '上六，乘馬班如，泣血漣如。'
                ]
            },
            '100010': {
                name: '蒙',
                yaoCi: [
                    '初六，發蒙，利用刑人，用說桎梏，以往吝。',
                    '九二，包蒙吉；納婦吉；子克家。',
                    '六三，勿用取女；見金夫，不有躬，無攸利。',
                    '六四，困蒙，吝。',
                    '六五，童蒙，吉。',
                    '上九，擊蒙；不利為寇，利禦寇。'
                ]
            }
        };

        const canvas = document.getElementById('hexagramCanvas');
        const ctx = canvas.getContext('2d');

        function drawYao(x, y, yao, lineHeight) {
            ctx.beginPath();
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 2;
            if (yao === '1') {
                // 陽爻 (Solid line)
                ctx.moveTo(x, y);
                ctx.lineTo(x + 50, y);
            } else if (yao === '0') {
                // 陰爻 (Broken line)
                ctx.moveTo(x, y);
                ctx.lineTo(x + 20, y);
                ctx.moveTo(x + 30, y);
                ctx.lineTo(x + 50, y);
            }
            ctx.stroke();
        }

        function drawHexagram(hexagramCode, startX, startY, lineHeight) {
            for (let i = 0; i < 6; i++) {
                const yao = hexagramCode[i];
                const y = startY - i * lineHeight;
                drawYao(startX, y, yao, lineHeight);
            }
        }

        function displayHexagram(hexagramCode) {
            const hexagram = yaoText[hexagramCode];
            if (!hexagram) {
                document.getElementById('hexagramName').textContent = 'Hexagram Not Found';
                for (let i = 0; i < 6; i++) {
                    document.getElementById('yao' + (5 - i)).textContent = '';
                }
                ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear canvas
                return;
            }

            document.getElementById('hexagramName').textContent = hexagram.name;
            for (let i = 0; i < 6; i++) {
                document.getElementById('yao' + (5 - i)).textContent = hexagram.yaoCi[i];
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear previous drawing
            const startX = 50;
            const startY = canvas.height - 50;
            const lineHeight = 70;
            drawHexagram(hexagramCode, startX, startY, lineHeight);
        }

        // Initial display (乾卦 as an example)
        displayHexagram('111111');

        // Example:  You can add event listeners to change the hexagram displayed
        // For instance, clicking the canvas could cycle through hexagrams.
        // canvas.addEventListener('click', () => {
        //   displayHexagram('000000'); // Change to 坤卦 on click
        // });

    </script>
</body>

</html>
