<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易經六十四卦</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            align-items: center;
        }

        canvas {
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        #hexagramName {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        #yaoTextContainer {
            margin-left: 20px;
            font-size: 16px;
        }

        .yao-text {
            height: 50px;
            display: flex;
            align-items: center;
            margin-bottom: 0px;
        }
    </style>
</head>

<body>
    <div class="container">
        <canvas id="hexagramCanvas" width="300" height="400"></canvas>

            <div class="yao-text" id="yao1"></div>
            <div class="yao-text" id="yao0"></div>
        </div>
    </div>
    <div id="hexagramName"></div>
