<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易經六十四卦</title>
  <style>
    /* 全域樣式 */
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      align-items: center;
    }
    canvas {
      background-color: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }
    #hexagramName {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    /* 爻辭容器設定最大高度並啟用捲動條 */
    #yaoTextContainer {
      margin-left: 20px;
      font-size: 16px;
      max-height: 300px;       /* 設定最大高度 */
      overflow-y: auto;        /* 超出部分顯示垂直滾動條 */
    }
    .yao-text {
      height: 50px;
      display: flex;
      align-items: center;
      margin-bottom: 0;
    }
    /* 小螢幕版面調整 */
    @media (max-width: 480px) {
      .container {
        flex-direction: column;
        align-items: center;
      }
      #yaoTextContainer {
        margin-left: 0;
        margin-top: 20px;
        width: 90%;
      }
      canvas {
        width: 90%;
        height: auto;
      }
      .yao-text {
        font-size: 14px;
        height: auto;
        padding: 5px 0;
      }
    }
  </style>
</head>

    </div>
  </div>
