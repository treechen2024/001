<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>易經六十四卦</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            padding: 10px;
        }
        .container {
            display: flex;
            align-items: flex-start;
            max-width: 100%;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        canvas {
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            cursor: pointer;
            max-width: 100%;
            height: auto;
        }
        #hexagramName {
            margin-top: 20px; /* 與上方內容的距離 */
            margin-bottom: 30px; /* 與按鍵的距離 */
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            line-height: 1.5; /* 增加行距，確保兩行顯示更清晰 */
            white-space: pre-line; /* 確保換行符被解析 */
        }
        #yaoTextContainer {
            font-size: 16px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 300px;
        }
        .yao-text {
            padding: 10px;
            border-bottom: 1px solid #eee;
            line-height: 1.4;
        }
        .yao-text:last-child {
            border-bottom: none;
        }
        #buttonContainer {
            display: flex;
            gap: 10px;
            margin-top: 0; /* 確保按鍵與卦名的距離由 #hexagramName 控制 */
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.8;
        }
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }
            #yaoTextContainer {
                margin-top: 20px;
                margin-left: 0;
                max-height: 300px;
                width: calc(100% - 20px);
            }
            canvas {
                width: 100%;
                max-width: 300px;
            }
            #hexagramName {
                font-size: 20px;
            }
            .yao-text {
                font-size: 14px;
            }
            button {
                width: 100%;
                max-width: 300px;
            }
            #hexagramSelect {
                width: 100%;
                max-width: 300px;
            }
        }
        #hexagramSelect {
            padding: 8px;
            font-size: 16px;
            width: 200px;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin-left: 10px;
        }
        .yao-container {
            margin-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .yao-text {
            padding: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .yao-text:hover {
            background-color: #f5f5f5;
        }
        
        .yao-modern {
            padding: 10px;
            background-color: #f8f8f8;
            border-radius: 4px;
            margin-top: 5px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
            display: none;
        }
        
        .yao-modern.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <canvas id="hexagramCanvas" width="300" height="400"></canvas>
        <div id="yaoTextContainer">
            <div class="yao-container">
                <div class="yao-text" id="yao0"></div>
                <div class="yao-modern hidden" id="yao0-modern"></div>
            </div>
            <div class="yao-container">
                <div class="yao-text" id="yao1"></div>
                <div class="yao-modern hidden" id="yao1-modern"></div>
            </div>
            <div class="yao-container">
                <div class="yao-text" id="yao2"></div>
                <div class="yao-modern hidden" id="yao2-modern"></div>
            </div>
            <div class="yao-container">
                <div class="yao-text" id="yao3"></div>
                <div class="yao-modern hidden" id="yao3-modern"></div>
            </div>
            <div class="yao-container">
                <div class="yao-text" id="yao4"></div>
                <div class="yao-modern hidden" id="yao4-modern"></div>
            </div>
            <div class="yao-container">
                <div class="yao-text" id="yao5"></div>
                <div class="yao-modern hidden" id="yao5-modern"></div>
            </div>
        </div>
    </div>
    <div id="hexagramName"></div>
    <div id="buttonContainer">
        <button id="reverseBtn" style="background-color: black; color: white;">錯卦</button>
        <button id="zongBtn" style="background-color: red; color: white;">綜卦</button>
        <select id="hexagramSelect"></select>
    </div>
    <script src="yijing_data.js"></script>
    <script>
        // 六十四卦名稱
        const hexagramNames = {
            '000000': '2.坤為地',
            '000001': '24.地雷復',
            '000010': '7.地水師',
            '000011': '19.地澤臨',
            '000100': '15.地山謙',
            '000101': '36.地火明夷',
            '000110': '46.地風升',
            '000111': '11.地天泰',
            '001000': '16.雷地豫',
            '001001': '51.震為雷',
            '001010': '40.雷水解',
            '001011': '54.雷澤歸妹',
            '001100': '62.雷山小過',
            '001101': '55.雷火豐',
            '001110': '32.雷風恆',
            '001111': '34.雷天大壯',
            '010000': '8.水地比',
            '010001': '3.水雷屯',
            '010010': '29.坎為水',
            '010011': '60.水澤節',
            '010100': '39.水山蹇',
            '010101': '63.水火既濟',
            '010110': '48.水風井',
            '010111': '5.水天需',
            '011000': '45.澤地萃',
            '011001': '17.澤雷隨',
            '011010': '47.澤水困',
            '011011': '58.兌為澤',
            '011100': '31.澤山咸',
            '011101': '49.澤火革',
            '011110': '28.澤風大過',
            '011111': '43.澤天夬',
            '100000': '23.山地剝',
            '100001': '27.山雷頤',
            '100010': '4.山水蒙',
            '100011': '41.山澤損',
            '100100': '52.艮為山',
            '100101': '22.山火賁',
            '100110': '18.山風蠱',
            '100111': '26.山天大畜',
            '101000': '35.火地晉',
            '101001': '21.火雷噬嗑',
            '101010': '64.火水未濟',
            '101011': '38.火澤睽',
            '101100': '56.火山旅',
            '101101': '30.離為火',
            '101110': '50.火風鼎',
            '101111': '14.火天大有',
            '110000': '20.風地觀',
            '110001': '42.風雷益',
            '110010': '59.風水渙',
            '110011': '61.風澤中孚',
            '110100': '53.風山漸',
            '110101': '37.風火家人',
            '110110': '57.巽為風',
            '110111': '9.風天小畜',
            '111000': '12.天地否',
            '111001': '25.天雷無妄',
            '111010': '6.天水訟',
            '111011': '10.天澤履',
            '111100': '33.天山遯',
            '111101': '13.天火同人',
            '111110': '44.天風姤\n女壯，勿用取女',
            '111111': '1.乾為天\n元亨利貞'
        };
        const canvas = document.getElementById('hexagramCanvas');
        const ctx = canvas.getContext('2d');
        
        // 初始化卦象（乾卦：六個陽爻）
        let hexagram = [1, 1, 1, 1, 1, 1]; // 1表示陽爻，0表示陰爻
        
        // 初始化下拉選單
        const selectElement = document.getElementById('hexagramSelect');
        Object.entries(hexagramNames).forEach(([key, value]) => {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = value;
            selectElement.appendChild(option);
        });

        // 監聽下拉選單變化
        selectElement.addEventListener('change', (event) => {
            const selectedKey = event.target.value;
            hexagram = selectedKey.split('').map(Number);
            drawHexagram();
            updateHexagramName();
        });
        
        // 繪製單個爻
        function drawLine(x, y, isYang) {
            const lineWidth = 160;
            const lineHeight = 20;
            const gap = 10;
            
            ctx.fillStyle = isYang ? '#FF0000' : '#0000FF';
            if (isYang) {
                // 陽爻：實線
                ctx.fillRect(x, y, lineWidth, lineHeight);
            } else {
                // 陰爻：虛線（兩段）
                ctx.fillRect(x, y, (lineWidth - gap) / 2, lineHeight);
                ctx.fillRect(x + (lineWidth + gap) / 2, y, (lineWidth - gap) / 2, lineHeight);
            }
        }
        
        // 繪製整個卦象
        function drawHexagram() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const startX = 70;
            const startY = 50;
            const spacing = 50;
            
            // 從上往下繪製六爻
            for (let i = 0; i < 6; i++) {
                drawLine(startX, startY + i * spacing, hexagram[i]);
            }
        }
        
        // 處理點擊事件
        canvas.addEventListener('click', (event) => {
            const rect = canvas.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            // 計算點擊的是哪一爻
            const startY = 50;
            const spacing = 50;
            const lineHeight = 20;
            const lineWidth = 160;
            const startX = 70;
            
            // 確保點擊在有效的水平範圍內
            if (x < startX || x > startX + lineWidth) {
                return;
            }
            
            // 從上到下檢查每一爻的點擊區域
            for (let i = 5; i >= 0; i--) {
                const lineY = startY + i * spacing;
                const clickArea = 30; // 擴大點擊判定區域
                
                if (y >= lineY - clickArea/2 && y <= lineY + lineHeight + clickArea/2) {
                    // 切換陰陽
                    hexagram[i] = 1 - hexagram[i];
                    drawHexagram();
                    updateHexagramName();
                    break;
                }
            }
        });
        
        // 更新卦名和爻辭
        function updateHexagramName() {
            const hexagramKey = hexagram.join('');
            const name = hexagramNames[hexagramKey] || '未知卦象';
            document.getElementById('hexagramName').textContent = name;
            
            // 更新爻辭
            const yaoData = yaoText[hexagramKey];
            const yaoModernData = yaoTextModern[hexagramKey];
            
            if (yaoData && yaoData.yaoCi) {
                for (let i = 0; i < 6; i++) {
                    const yaoElement = document.getElementById(`yao${i}`);
                    const yaoModernElement = document.getElementById(`yao${i}-modern`);
                    
                    if (yaoData.yaoCi[i]) {
                        yaoElement.textContent = yaoData.yaoCi[i];
                        if (yaoModernData && yaoModernData.yaoCiModern[i]) {
                            yaoModernElement.textContent = yaoModernData.yaoCiModern[i];
                        }
                    } else {
                        yaoElement.textContent = '';
                        yaoModernElement.textContent = '';
                    }
                }
            }
        }

        // 添加爻辭點擊事件處理
        for (let i = 0; i < 6; i++) {
            const yaoElement = document.getElementById(`yao${i}`);
            const yaoModernElement = document.getElementById(`yao${i}-modern`);
            
            yaoElement.addEventListener('click', () => {
                const isShown = yaoModernElement.classList.contains('show');
                // 隱藏所有白話爻辭
                document.querySelectorAll('.yao-modern').forEach(el => {
                    el.classList.remove('show');
                });
                // 切換當前白話爻辭的顯示狀態
                if (!isShown) {
                    yaoModernElement.classList.add('show');
                }
            });
        }
        
        // 初始繪製
        drawHexagram();
        updateHexagramName();

        // 錯卦功能
        document.getElementById('reverseBtn').addEventListener('click', () => {
            // 將所有爻的陰陽狀態取反
            for (let i = 0; i < 6; i++) {
                hexagram[i] = 1 - hexagram[i];
            }
            drawHexagram();
            updateHexagramName();
        });

        // 綜卦功能
        document.getElementById('zongBtn').addEventListener('click', () => {
            // 將六爻順序顛倒
            hexagram = [...hexagram].reverse();  // 修正了這裡！
            drawHexagram();
            updateHexagramName();
        });
    </script>
</body>
</html>
